name: Reliability tests

on:
  pull_request:
  push:
    branches: [main, fix/production-evaluation-reliability]

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi
      - name: Run resilience and evaluation metric tests
        run: python -m pytest -q TESTS/test_production_metrics.py
