services:
  openforge-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: openforge-ai:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-10000}
    ports:
      - "${HOST_PORT:-10000}:${PORT:-10000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '10000') + '/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
